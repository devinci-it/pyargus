[pytest]
# Pytest configuration for PyArgus

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

testpaths = tests
addopts = 
    -v
    --strict-markers
    --disable-warnings
    -ra

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    security: Security tests

# Coverage configuration
[coverage:run]
source = app
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
